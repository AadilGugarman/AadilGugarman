  <path d="M0 286C174 238 263 326 421 279C559 238 633 222 960 264" stroke="#65E6C2" stroke-opacity=".22"/>
  <g opacity=".8" fill="#D9FFF4"><circle cx="78" cy="72" r="2"/><circle cx="376" cy="58" r="2"/><circle cx="530" cy="292" r="2"/><circle cx="881" cy="76" r="2"/></g>
